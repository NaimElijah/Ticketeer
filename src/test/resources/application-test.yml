spring:
  datasource:
    # One database per Spring context: a context never sees another's rows. Without DB_CLOSE_DELAY
    # the database lives as long as the context's connection pool, not until the JVM exits.
    url: jdbc:h2:mem:testdb-${random.uuid};DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # No explicit dialect: Hibernate detects H2 here, and PostgreSQL when an *IT points the datasource
  # at a container (ADR-006). The schema comes from the Flyway migrations, as in every run (ADR-007).

# JWT signing secret (test-only, never used in prod).
jwt:
  secret: test-only-secret-do-not-use-anywhere-else-must-be-at-least-256-bits-long

# The test profile's own session lengths. A SESSION_MEMBER_TTL_MINUTES or SESSION_GUEST_IDLE_TIMEOUT_MINUTES
# variable in the shell still overrides them: Spring binds an environment variable named after a property
# above any profile file.
session:
  member-ttl-minutes: 60
  guest-idle-timeout-minutes: 10

# The hold on a reserved ticket, in minutes, that the suite assumes. Set here so the
# TICKET_RESERVATION_DURATION variable that application.yml reads cannot reach a test.
constants:
  ticket-reservation-duration: 10

# Not pinned, because a pin here would not hold: PLATFORM_ADMIN_PASSWORD, PLATFORM_TIME_ZONE and
# AUTH_LOCKOUT_MAX_ATTEMPTS bind straight to platform.admin.password, platform.time-zone and
# auth.lockout.max-attempts, above this file. Unset them before running the suite (#189).
