# Supabase (remote Postgres) run profile — V3 Lane J (#377).
#
# Activate with SPRING_PROFILES_ACTIVE=supabase. The Jpa* repositories are wired in every run
# (ADR-005); this profile only adds the SSL/pooler datasource. Supply the connection
# entirely via env vars; NEVER commit them:
#
#   DB_HOST=aws-1-eu-central-1.pooler.supabase.com   (your project's Session-pooler host)
#   DB_PORT=5432                                      (Session pooler — NOT the 6543 txn pooler)
#   DB_NAME=postgres
#   DB_USER=postgres.<project-ref>
#   DB_PASSWORD=<your database password>
#
# Uses the Supabase Session pooler (IPv4, supports the prepared statements Hibernate needs) over TLS.
# Many app instances (local + deployed) can point here at once — they share all data, and @Version /
# the refund FOR UPDATE coordinate across instances because they're enforced in Postgres.
spring:
  datasource:
    # logServerErrorDetail=false: as in application.yml, no row values in logged exception messages.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require&logServerErrorDetail=false
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Supabase caps connections (more so when several instances share the DB) — keep each pool small.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      # --- DB-reconnect / recovery resilience (SLR.6, #362), config-only: no health-poller, no retry lib ---
      # The reconnect is HikariCP's own job: it validates a pooled connection before lending it (the default
      # 30s connection-timeout / 5s validation-timeout bound a clean failure during an outage), so once
      # Postgres is back the next borrow gets a fresh connection and the app resumes with NO restart.
      # These three knobs make that recovery smooth and safe:
      max-lifetime: 600000             # retire each connection after 10 min, before the Supabase pooler can
                                       # silently drop an idle one — so a request is never lent a dead connection
      keepalive-time: 300000           # ping idle connections every 5 min to keep them warm / detect dead ones
      initialization-fail-timeout: 0   # the pool itself starts without a connection, but Hibernate needs one
                                       # at boot, so an unreachable DB still stops startup (ADR-005)
