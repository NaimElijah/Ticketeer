# V3 dev profile.
#
# dev runs on the real JPA persistence path against in-memory H2 (no Postgres or
# Docker needed locally): every aggregate's Jpa* repository is wired, as in every
# run (ADR-005), and persists to H2. The database is in memory, so each boot starts empty and
# Flyway builds the schema from the same migrations as PostgreSQL (ADR-007).
#
# Deploy/run uses the SAME repositories against Postgres (Supabase) by setting the
# DB_* env vars — a config-only switch, no code change.
#
#   ./mvnw spring-boot:run "-Dspring-boot.run.profiles=dev"
spring:
  datasource:
    url: jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

# Scenario init (ScenarioRunner) — boots the system from an editable command file.
#   scenario:  the file to run (classpath:scenarios/*.scenario, or file:/abs/path/to/your.scenario)
#   mode:      off (nothing) | reseed (idempotent) | wipe (clear data) | reset (wipe + reseed)
#              | ask (interactive menu: pick mode + scenario at boot)
#   fail-fast: true = stop at the first unexpected error and fail startup (partial report still logged;
#              the default outside dev); false = run all and boot anyway, so a broken demo line
#              doesn't block local work
# dev's H2 is in memory (empty every boot), so reseed is the right default here — no wipe needed.
seed:
  scenario: classpath:scenarios/demo.scenario
  mode: reseed
  fail-fast: false

# WSEP external-systems client. Prod/eval keep the 20s default (application.yml is
# untouched); dev shortens the per-request timeout so the "gateway unreachable" demo
# (e.g. CVV 986, which never answers) surfaces the generic error in ~8s instead of ~20s.
wsep:
  request-timeout-seconds: 8
