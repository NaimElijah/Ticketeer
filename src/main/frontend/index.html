<!DOCTYPE html>
<!--
Vaadin generated this file and regenerates it only when it is missing, so edits here persist.
Every route is served from this page, so the root element's lang="en" declares the language of the
whole UI to screen readers (WCAG 3.1.1, #188; PageLanguageTest).
-->

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    html, body, #outlet {
      height: 100%;
      width: 100%;
      margin: 0;
    }
  </style>
  <!-- index.ts is included here automatically (either by the dev server or during the build) -->
</head>
<body>
  <!-- This outlet div is where the views are rendered -->
  <div id="outlet"></div>
</body>
</html>
