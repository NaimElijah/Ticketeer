# Weekly update pull requests into dev, the integration branch (#47, ADR-010). Dependabot reads this
# file from the default branch, so it takes effect once it reaches main.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The Boot parent and the Spring Modulith BOM move together. (Libraries the Boot BOM manages
      # without a version in this pom, Flyway for one, are invisible to Dependabot.)
      spring:
        patterns: ["org.springframework*"]
      vaadin:
        patterns: ["com.vaadin*"]
    ignore:
      # 24.10.7 is the last free Vaadin 24; later 24.10.x need a subscription, although Maven Central
      # serves them, and 25.x needs Spring Boot 4 (ADR-009).
      - dependency-name: "com.vaadin:*"
        versions: [">24.10.7"]
      # ArchUnit stays at the version spring-modulith-core is built against (pom.xml); it moves
      # when Modulith does, by hand, not on its own release.
      - dependency-name: "com.tngtech.archunit:archunit"
      # Jackson and Netty are pinned to patched releases of the lines Boot 3.5 was built against
      # (pom.xml, ADR-009). Their next minors (Jackson 2.22, Netty 4.2) are not drop-in under Boot
      # 3.5, so only their patches are proposed.
      - dependency-name: "com.fasterxml.jackson:jackson-bom"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "io.netty:netty-bom"
        update-types: ["version-update:semver-minor"]
      # The project stays on the Boot 3.5 / Spring 6 / Hibernate 6 lines until the planned major
      # upgrade (ADR-009); Dependabot would otherwise propose Boot 4 and every library's next major.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
