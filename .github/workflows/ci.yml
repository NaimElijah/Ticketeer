name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Least privilege for GITHUB_TOKEN: the jobs only check out and read the repository. Artifact upload and
# the Maven cache use the runner's own token, not this one.
permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes, so later steps have no use for a persisted token.
          persist-credentials: false

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The JVM zone is explicit so this job and the one below differ only in it (ADR-008).
      - name: Build + test (mvn -B verify, JVM in UTC)
        run: mvn -B verify "-DargLine=-Duser.timezone=UTC"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  test-jerusalem:
    # The same suite with the JVM at UTC+2/+3 (#74, ADR-008): code that reads the JVM's zone passes in
    # UTC and fails here. Not a required check until the branch ruleset lists it; keep this name stable.
    name: Test in Asia/Jerusalem
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes, so later steps have no use for a persisted token.
          persist-credentials: false

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test (mvn -B -Pno-vaadin verify, JVM in Asia/Jerusalem)
        run: mvn -B -Pno-vaadin verify "-DargLine=-Duser.timezone=Asia/Jerusalem"

      # Guards against the zone silently not reaching the forked test JVM, which would make this job
      # a second UTC run.
      - name: Check the tests ran in Asia/Jerusalem
        run: grep -q 'name="user.timezone" value="Asia/Jerusalem"' target/surefire-reports/TEST-*.xml

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-jerusalem
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  production-artifact:
    # The -Pproduction jar is what a deploy runs. It must not carry the dev-only libraries (#79):
    # Vaadin's dev server, dev bundle and Copilot, and the H2 engine. It must also start, because
    # pom.xml overrides library versions under Boot and Vaadin that no test exercises in a running
    # app (ADR-009). Not a required check yet.
    name: Production artifact
    runs-on: ubuntu-latest

    services:
      postgres:
        # The image the *IT classes use (support/PostgresContainers).
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: ticketing
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ticketing"
          --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes, so later steps have no use for a persisted token.
          persist-credentials: false

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The tests run in the build job; this one only proves what the production jar contains.
      - name: Package (mvn -B -Pproduction -DskipTests package)
        run: mvn -B -Pproduction -DskipTests package

      - name: Check the jar holds no dev-only library
        run: |
          jar=$(ls target/*.jar)
          libs=$(unzip -Z1 "$jar" 'BOOT-INF/lib/*')
          # A listing that missed the libraries would pass the check below vacuously.
          if ! grep -q '^BOOT-INF/lib/vaadin-core-' <<< "$libs"; then
            echo "::error::No vaadin-core in the BOOT-INF/lib listing of $jar; the check cannot run."
            exit 1
          fi
          if grep -E '^BOOT-INF/lib/(h2|vaadin-dev|vaadin-dev-server|vaadin-dev-bundle|copilot|hilla-dev|ui-tests|netty)-[0-9a-z]' <<< "$libs"; then
            echo "::error file=pom.xml::The production jar contains a dev-only library; see the production profile (#79)."
            exit 1
          fi

      - name: Boot the jar against PostgreSQL and check it serves
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: ticketing
          DB_USER: postgres
          DB_PASSWORD: ci-only
          # No WSEP in CI: the handshake fails fast and the boot carries on without it (ADR-003).
          # https, because the base URL is refused at binding otherwise; port 1 still refuses the connection.
          WSEP_BASE_URL: https://127.0.0.1:1/
          WSEP_HANDSHAKE_ATTEMPTS: '1'
          # Throwaway CI-only values, not real secrets: a boot outside dev and test refuses the
          # defaults committed in application.yml (CommittedDefaultSecretsGuard, #34).
          JWT_SECRET: ci-only-throwaway-jwt-secret-e92bf9cc04b38624e5f09df0499b1092602b571fa1a2b1ca
          PLATFORM_ADMIN_PASSWORD: ci-only-throwaway-admin-password
        run: |
          java -jar "$(ls target/*.jar)" > app.log 2>&1 &
          pid=$!
          for attempt in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"UP"'; then break; fi
            # A jar that died at startup won't come up; report it now instead of after the timeout.
            kill -0 "$pid" 2>/dev/null || break
            sleep 3
          done
          if ! curl -fs http://localhost:8080/actuator/health | grep -q '"UP"' || ! curl -fs -o /dev/null http://localhost:8080/; then
            echo "::error::The production jar did not come up healthy and serve /."
            cat app.log
            exit 1
          fi
